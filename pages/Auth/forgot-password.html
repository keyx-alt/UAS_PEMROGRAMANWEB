<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password — VeloraSec</title>
<link rel="icon" type="image/png" sizes="32x32" rel="icon" href="../../image/icons8-reset-32.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../../style.css"/>
<link rel="stylesheet" href="auth.css"/>
</head>
<body>

<div class="cyber-grid" aria-hidden="true"></div>
<div id="particles" aria-hidden="true"></div>

<div class="auth-wrap">
  <div class="auth-card" id="card-request">

    <!-- Logo -->
    <div class="auth-logo">
      <i class="fas fa-shield-halved" style="color:var(--primary);font-size:24px"></i>
      <div>
        <div style="font-size:15px;font-weight:900;letter-spacing:2px;color:var(--primary)">VeloraSec</div>
        <div style="font-size:8px;color:var(--muted);letter-spacing:3px">LEARNING HUB</div>
      </div>
    </div>

    <div class="auth-title">Reset Password</div>
    <div class="auth-sub">&gt; Enter your email to receive a reset link</div>

    <!-- Email -->
    <div class="input-group">
      <label class="input-label">Email</label>
      <div class="input-icon-wrap">
        <i class="fas fa-at ii"></i>
        <input type="email" class="cyber-input" placeholder="operator@velorasec.io"
               id="forgot-email" autocomplete="email"/>
      </div>
    </div>

    <button class="cyber-btn btn-primary auth-btn-full" onclick="handleForgotPassword()">
      <i class="fas fa-paper-plane"></i> SEND RESET LINK
    </button>

    <div class="auth-footer" style="margin-top:20px">
      <a class="auth-link" href="login.html">
        <i class="fas fa-arrow-left" style="font-size:10px"></i> Back to Login
      </a>
    </div>

    <div id="forgot-msg" style="display:none;margin-top:14px"></div>

  </div>

  <!-- ── Success state ── -->
  <div class="auth-card" id="card-success" style="display:none;text-align:center">

    <div style="margin-bottom:24px">
      <i class="fas fa-envelope-circle-check"
         style="font-size:48px;color:var(--primary);filter:drop-shadow(0 0 16px rgba(0,255,204,0.4))"></i>
    </div>

    <div class="auth-title">Check Your Email</div>
    <div class="auth-sub" id="success-sub">&gt; Reset link sent to your inbox</div>

    <div class="box box-success" style="font-size:12px;margin-bottom:24px">
      <i class="fas fa-circle-check box-icon" style="color:var(--success)"></i>
      <span>If this email is registered, you'll receive a reset link within a few minutes. Check your spam folder too.</span>
    </div>

    <button class="cyber-btn btn-outline auth-btn-full"
            onclick="window.location.href='login.html'">
      <i class="fas fa-arrow-left"></i> BACK TO LOGIN
    </button>

    <div class="auth-footer" style="margin-top:20px">
      Didn't receive it?
      <a class="auth-link" onclick="resetToForm()" style="cursor:pointer">Try again →</a>
    </div>

  </div>
</div>

<script src="auth.js"></script>
<script>
function handleForgotPassword() {
  const email = document.getElementById('forgot-email')?.value.trim();

  if (!email) {
    showAuthMsg('forgot-msg', 'error', 'Please enter your email address.'); return;
  }
  if (!email.includes('@')) {
    showAuthMsg('forgot-msg', 'error', 'Enter a valid email address.'); return;
  }

  const btn = document.querySelector('#card-request .cyber-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SENDING...';

  // Simulate async send
  setTimeout(() => {
    const sub = document.getElementById('success-sub');
    sub.textContent = `> Reset link sent to ${email}`;
    document.getElementById('card-request').style.display = 'none';
    document.getElementById('card-success').style.display = '';
  }, 1200);
}

function resetToForm() {
  const btn = document.querySelector('#card-request .cyber-btn');
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-paper-plane"></i> SEND RESET LINK';
  document.getElementById('forgot-email').value = '';
  const msg = document.getElementById('forgot-msg');
  msg.style.display = 'none';
  document.getElementById('card-success').style.display = 'none';
  document.getElementById('card-request').style.display = '';
}
</script>
</body>
</html>
